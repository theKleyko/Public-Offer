<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="0; url=/ego-architecture-audit.pdf">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ego Architecture Protocol</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/Inverted cat 16px lower.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/Inverted cat 16px lower.png">
    <link rel="apple-touch-icon" href="images/Inverted cat 16px lower.png">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Ego Architecture Protocol">
    <meta property="og:description" content="Download the Ego Architecture Protocol PDF">
    <meta property="og:image" content="images/Circle Kleyko Cat logo no transparency.png">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #1d4ed8;
        }

        .pdf-viewer {
            flex: 1;
            width: 100%;
            border: none;
        }

        .fallback {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .fallback p {
            margin-bottom: 24px;
            color: #888;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Ego Architecture Protocol</h1>
            <a href="ego-architecture-audit.pdf" download class="download-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download PDF
            </a>
        </header>

        <iframe
            class="pdf-viewer"
            src="ego-architecture-audit.pdf"
            title="Ego Architecture Protocol PDF"
        ></iframe>

        <div class="fallback" id="fallback">
            <p>Your browser doesn't support embedded PDFs.</p>
            <a href="ego-architecture-audit.pdf" download class="download-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download PDF
            </a>
        </div>
    </div>

    <script>
        // Fallback for browsers that can't display PDF
        const iframe = document.querySelector('.pdf-viewer');
        iframe.onerror = function() {
            iframe.style.display = 'none';
            document.getElementById('fallback').style.display = 'flex';
        };
    </script>
</body>
</html>
